<div class="container-fluid p-4">

    <!-- Encabezado -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>👥 Gestión de Clientes</h2>
        <div>
            <button class="btn btn-primary me-2" (click)="nuevoCliente()">
                ➕ Nuevo Cliente
            </button>
            <button class="btn btn-outline-danger" (click)="cerrarSesion()">
                🚪 Cerrar Sesión
            </button>
        </div>
    </div>

    <!-- Mensaje de error -->
    <div class="alert alert-danger" *ngIf="error_js">
        {{ error_js }}
    </div>

    <!-- Indicador de carga -->
    <div class="text-center py-5" *ngIf="cargando_js">
        <div class="spinner-border text-primary"></div>
        <p class="mt-2">Cargando clientes...</p>
    </div>

    <!-- Tabla de clientes -->
    <div class="card shadow" *ngIf="!cargando_js">
        <div class="card-body p-0">
            <table class="table table-hover mb-0">
                <thead class="table-primary">
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Correo</th>
                        <th>Teléfono</th>
                        <th>Estatus</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Sin clientes -->
                    <tr *ngIf="clientes_js.length === 0">
                        <td colspan="6" class="text-center py-4 text-muted">
                            No hay clientes registrados.
                        </td>
                    </tr>
                    <!-- Lista de clientes -->
                    <tr *ngFor="let cliente of clientes_js">
                        <td>{{ cliente.id }}</td>
                        <td>{{ cliente.nombre }}</td>
                        <td>{{ cliente.correo }}</td>
                        <td>{{ cliente.telefono }}</td>
                        <td>
                            <span class="badge"
                                [ngClass]="cliente.estatus === 'Activo' ? 'bg-success' : 'bg-danger'">
                                {{ cliente.estatus }}
                            </span>
                        </td>
                        <td>
                            <button class="btn btn-sm btn-warning me-1"
                                (click)="editarCliente(cliente.id)">
                                ✏️ Editar
                            </button>
                            <button class="btn btn-sm btn-danger"
                                (click)="eliminarCliente(cliente.id)">
                                🗑️ Eliminar
                            </button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

</div>
